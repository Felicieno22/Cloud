 
services:  
  postgres:  
    image: postgres:13  
    restart: always  
    environment:  
      POSTGRES_DB: identit  
      POSTGRES_USER: postgres  
      POSTGRES_PASSWORD: postgres  
    ports:  
      - "5432:5432"  

  app:  
    build: .  
    depends_on:  
      - postgres  
    environment:  
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identit  
      SPRING_DATASOURCE_USERNAME: postgres  
      SPRING_DATASOURCE_PASSWORD: postgres  
    ports:  
      - "8080:8080"